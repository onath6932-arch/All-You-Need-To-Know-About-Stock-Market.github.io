<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Japanese 3D Experience</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    * { touch-action: manipulation; box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080708; color: #e2d9cc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    
    .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 16px; }
    .brand-header { font-size: 14px; letter-spacing: 3px; color: #d4af37; text-transform: uppercase; border-left: 2px solid #8c2323; padding-left: 8px; }
    
    /* Native Mobile Bottom Sheet Drawer */
    .bottom-sheet { 
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(18, 16, 16, 0.92); border: 1px solid #28211d; border-top: 2px solid #8c2323; 
      border-radius: 16px 16px 0 0; padding: 24px 20px; pointer-events: auto; 
      transform: translateY(120%); transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1); 
      backdrop-filter: blur(10px); z-index: 10;
    }
    .bottom-sheet.active { transform: translateY(0); }
    .bottom-sheet h3 { color: #d4af37; margin: 0 0 8px 0; font-size: 16px; }
    .bottom-sheet p { font-size: 12px; color: #a69888; margin: 0 0 16px 0; line-height: 1.5; }
    .btn-buy { background: #8c2323; color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer">
    <div class="brand-header">Edo Crafts • 3D Experience</div>
  </div>

  <div id="sheet" class="bottom-sheet">
    <h3 id="sheet-title">Handmade Artisanal Kimono</h3>
    <p id="sheet-desc">Woven with traditional Japanese silk patterns and dyed in authentic crimson lacquer indigo tones.</p>
    <button class="btn-buy" onclick="closeSheet()">Dismiss Drawer</button>
  </div>

  <script>
    // 1. Mobile WebGL Setup
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080708, 0.15);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    // 2. Atmospheric Warm Lighting Rig
    const ambientLight = new THREE.AmbientLight(0xffd5a0, 0.8);
    scene.add(ambientLight);

    const warmPointLight = new THREE.PointLight(0xff6b35, 2.5, 10);
    warmPointLight.position.set(-1.5, 1, 2);
    scene.add(warmPointLight);

    const coolRimLight = new THREE.DirectionalLight(0x4a7c59, 1.2);
    coolRimLight.position.set(2, 2, -2);
    scene.add(coolRimLight);

    // 3. Character Anchor Mesh
    const geo = new THREE.CylinderGeometry(0.5, 0.7, 2, 32);
    const mat = new THREE.MeshStandardMaterial({ color: 0x8c2323, roughness: 0.3, metalness: 0.1 });
    const characterMesh = new THREE.Mesh(geo, mat);
    characterMesh.position.set(0, -0.3, 0);
    scene.add(characterMesh);

    // 4. Secondary Motion / Spring-Damping Physics State
    let springPosY = 0, velocityY = 0;
    const stiffness = 0.08, damping = 0.75;

    // 5. Native Touch Event Handler
    let startY = 0, touchMoved = false;

    window.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      touchMoved = false;
    });

    window.addEventListener('touchmove', (e) => {
      const deltaY = e.touches[0].clientY - startY;
      if (Math.abs(deltaY) > 8) {
        touchMoved = true;
        // Inject velocity impulse into physics loop
        velocityY += deltaY * 0.0012; 
        characterMesh.rotation.y += deltaY * 0.005;
        startY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchend', () => {
      if (!touchMoved) {
        triggerSheet("Artisanal Crafts Showcase", "Tap and drag on screen to trigger touch physics and rotate character.");
        velocityY += 0.06; // Tap physics recoil
      }
    });

    function triggerSheet(title, desc) {
      document.getElementById('sheet-title').innerText = title;
      document.getElementById('sheet-desc').innerText = desc;
      document.getElementById('sheet').classList.add('active');
    }

    function closeSheet() {
      document.getElementById('sheet').classList.remove('active');
    }

    // 6. Smooth 60FPS Physics Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // Solve Damped Harmonic Oscillator Equations
      const forceY = -stiffness * springPosY;
      velocityY += forceY;
      velocityY *= damping;
      springPosY += velocityY;

      // Soft-body mesh deformation recoil
      characterMesh.scale.y = 1 + springPosY * 0.35;
      characterMesh.scale.x = 1 - springPosY * 0.18;

      renderer.render(scene, camera);
    }
    animate();

    // 7. Responsive Viewport Orientation Listener
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
